[package]
name = "tao_bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "start_bot"
path = "src/bin/start_bot.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# Substrate/Bittensor
subxt = { version = "0.34", features = ["jsonrpsee", "substrate-compat", "sp-core", "sp-runtime"] }
parity-scale-codec = { version = "3.0", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenv = "0.15"
config = "0.14"

# Crypto
hex = "0.4"
bs58 = "0.5"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
futures = "0.3"

# Logging
env_logger = "0.11"
log = "0.4"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# WebSocket (not currently used, but kept for future WebSocket support)
# tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# OpenSSL vendored for cross-compilation support
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tokio-test = "0.4"
